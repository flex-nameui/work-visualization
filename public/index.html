<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>work-visualization</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFFFFF; color: #1F1E1B;
    }
    @media (prefers-color-scheme: dark) { body { background: #191918; color: #F7F6F3; } }
    .wrap { text-align: center; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    a { display: inline-block; padding: 8px 16px; border-radius: 6px; text-decoration: none;
        background: #378ADD; color: #fff; font-size: 14px; }
    p { font-size: 13px; color: #91918C; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>work-visualization</h1>
    <a href="./passkeys/">패스키 일정 대시보드 열기 →</a>
    <p>대시보드는 <code>/passkeys/</code> 경로에 있습니다.</p>
  </div>
</body>
</html>
